<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>אזרחות מאסטר</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#16213a;--mu:#5b6785;--ac:#4f46e5;--ac2:#06b6d4;--ok:#16a34a;--bad:#dc2626;--bd:#dde3f0;--fs:17px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1224;--card:#171e38;--tx:#eaf0ff;--mu:#9aa7c7;--ac:#818cf8;--ac2:#22d3ee;--bd:#2a3355}}
:root[data-theme=dark]{--bg:#0d1224;--card:#171e38;--tx:#eaf0ff;--mu:#9aa7c7;--ac:#818cf8;--ac2:#22d3ee;--bd:#2a3355}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs)/1.7 "Heebo","Segoe UI",Arial,sans-serif;transition:background .3s,color .3s}
header{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:46px;height:46px;border-radius:14px;background:#fff3;display:grid;place-items:center;font-size:26px;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px) rotate(-4deg)}}
h1{margin:0;font-size:1.5em;flex:1}h1 small{display:block;font-size:.5em;font-weight:400;opacity:.9}
.acc{display:flex;gap:6px}.acc button{background:#fff3;color:#fff;border:1px solid #fff6;border-radius:10px;padding:6px 10px;cursor:pointer;font:inherit;font-size:.85em}
.acc button:hover{background:#fff5}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button,.chip{flex:none;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:999px;padding:7px 16px;cursor:pointer;font:inherit;transition:.2s}
nav button.on,.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:860px;margin:0 auto;padding:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:10px;animation:in .4s both;box-shadow:0 2px 8px #0000000a}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card h3{margin:0 0 4px;color:var(--ac);font-size:1.05em}.card p{margin:0}
.sub{margin:8px 0 0;padding:8px 12px;border-inline-start:3px solid var(--ac2);background:#06b6d412;border-radius:8px;font-size:.93em}
.sub b{color:var(--ac)}.tg{display:inline-block;background:#4f46e51f;color:var(--ac);border:1px solid var(--ac);border-radius:8px;padding:0 9px;font-size:.72em;margin-inline-end:6px;line-height:1.6}.mu{color:var(--mu);font-size:.9em;margin:0 0 10px}.blr{cursor:pointer}.blr p,.blr .sub{filter:blur(9px);user-select:none;transition:filter .3s}.blr.open p,.blr.open .sub{filter:none;user-select:auto}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.logo svg{overflow:visible}.beam{transform-box:view-box;transform-origin:24px 15px;animation:tilt 5s ease-in-out infinite}.dot{transform-box:fill-box;transform-origin:center;animation:pl 2.5s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes pl{50%{transform:scale(1.7);opacity:.6}}footer{text-align:center;color:var(--mu);font-size:.9em;padding:22px 16px 28px;border-top:1px solid var(--bd);margin-top:24px;direction:ltr}footer b{color:var(--ac)}
.sec{display:flex;gap:8px;align-items:center;margin:4px 0 12px}.sec h2{margin:0}
button.pri{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font:inherit}
button.pri:hover{filter:brightness(1.1)}
.fc{perspective:900px;height:230px;margin:14px 0;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fc.flip .fi{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:2px solid var(--ac);border-radius:20px;display:grid;place-items:center;text-align:center;padding:20px;overflow:auto}
.fa{font-size:1.5em;font-weight:700;color:var(--ac)}.fb{transform:rotateY(180deg)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.opt{display:block;width:100%;text-align:start;margin:6px 0;padding:11px 14px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:#16a34a22}.opt.no{border-color:var(--bad);background:#dc262622}
textarea{width:100%;min-height:150px;border:2px solid var(--bd);border-radius:12px;padding:12px;background:var(--card);color:var(--tx);font:inherit}
a{color:var(--ac)}.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.nomo *{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#cb{position:fixed;z-index:50;left:14px;top:60%;touch-action:none}
#cbb{width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:26px;cursor:grab;box-shadow:0 6px 18px #0004;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
#cbb:active{cursor:grabbing}
#cbn{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font:700 12px/20px sans-serif;font-style:normal;padding:0 5px;text-align:center}
#cbp{position:absolute;left:0;width:min(330px,calc(100vw - 28px));height:min(430px,70vh);background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;box-shadow:0 10px 32px #0005;display:flex;flex-direction:column;overflow:hidden;font-size:15px}
#cbp[hidden]{display:none}
#cbp .ch{display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff}
#cbp .ch b{flex:1}
#cbp .ch button{background:#fff3;border:0;color:#fff;border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px}
#cbname{width:100%;border:0;border-bottom:1px solid var(--bd);background:transparent;color:var(--tx);padding:7px 12px;font:inherit;font-size:.9em}
#cbl{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px}
.cm{max-width:88%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;align-self:flex-start;word-break:break-word;white-space:pre-wrap;line-height:1.5}
.cm.me{align-self:flex-end;background:#4f46e51f;border-color:var(--ac)}
.cm small{display:block;color:var(--mu);font-size:.75em;margin-bottom:1px}
#cbs{padding:4px 12px;color:var(--mu);font-size:.8em;min-height:1.4em}
.cbf{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}
.cbf input{flex:1;min-width:0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);padding:8px 10px;font:inherit}
.cbf button{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:0 14px;font:inherit;cursor:pointer}
.cbf button:disabled{opacity:.5}

.card .bt{margin:0 0 2px;font-size:1.12em}
.card .bk{margin:0 0 8px;color:var(--mu);font-size:.9em}
.card.mi{border-inline-start:4px solid var(--ac2)}
.bi{padding:10px 0;border-top:1px dashed var(--bd)}
.bi:first-of-type{border-top:0}
.bi:last-child{padding-bottom:0}
.card.blk>.bi:only-of-type{padding:0}
.bi h4{display:inline;margin:0;color:var(--ac);font-size:1.02em}
.bi p{margin-top:3px}
.stm .bk{display:none}

#adm{position:absolute;top:4px;left:4px;z-index:5;font:700 11px sans-serif;letter-spacing:.6px;padding:3px 9px;border-radius:8px;border:1px solid #fff6;background:#0003;color:#fff;cursor:pointer}
.ov{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:#0009;padding:14px}
.ov>div{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:18px 20px;width:min(480px,100%);max-height:88vh;overflow:auto;box-shadow:0 12px 40px #0006}
.ov h3{margin:0 0 10px;color:var(--ac)}
.ov input,.ov textarea{width:100%;box-sizing:border-box;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);padding:9px 10px;font:inherit;margin-bottom:8px}
.ov textarea{min-height:80px;resize:vertical}
.ov .rw{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ov .am{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:6px 8px;margin-bottom:6px;font-size:.9em}
.ov .am span{flex:1;word-break:break-word;white-space:pre-wrap}
.ov .am button{border:0;background:var(--bad);color:#fff;border-radius:8px;cursor:pointer;padding:2px 8px}
.ov .er{color:var(--bad);min-height:1.3em;font-size:.9em;margin-bottom:6px}
.ov hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
</style></head><body>
<header>
<div class="logo" aria-hidden="true">⚖️</div><h1><span id="ttl">אזרחות מאסטר | למידה</span><small>לומדים בעל פה, בקלות</small></h1>
<div class="acc" role="group" aria-label="נגישות"><button id="th" aria-label="מצב בהיר או כהה">🌓 בהיר/כהה</button><button id="fp" aria-label="הגדלת טקסט">א+</button><button id="fm" aria-label="הקטנת טקסט">א−</button><button id="mo" aria-label="ביטול אנימציות">⏸ אנימציה</button></div></header>

<script>
const FB={db:'https://ezrachut-master-default-rtdb.europe-west1.firebasedatabase.app',key:'AIzaSyD2bm_U9I6Ou_5kGddWbYwaHW6mvCunlhg',admin:'elad@ezrachut-master.com'};
const G=[
{id:"nat",t:"🏳️ הרעיון הלאומי",i:[
["לאום","קבוצה שרוצה הגדרה עצמית: מדינה עצמאית, על יסודות אתניים או אזרחיים."],
["קבוצה אתנית","קבוצה עם יסודות משותפים שלא בוחרים (מוצא, דת, שפה, תרבות, היסטוריה). לא שואפת להגדרה עצמית."],
["לאומיות","תחושת שייכות וגאווה של בני הלאום, שמתבטאת בחיים במדינה משותפת."],
["לאומיות אתנית־תרבותית","מבוססת על יסודות שנולדים לתוכם. קיימת לפני המדינה והיא שיוצרת אותה. דוגמה: ישראל.",["אזרחות ולאום לא חייבים להתאים: ערבי ישראלי = לאום ערבי + אזרחות ישראלית."]],
["לאומיות אזרחית","מבוססת על ערכים שבוחרים (חירות, שוויון). נוצרת אחרי המדינה, והמדינה יוצרת אותה. דוגמה: ארה״ב.",["כל האזרחים הם בני אותו לאום."]],
["הבדלים בין לאום לקבוצה אתנית","שני הבדלים עיקריים:",["שאיפה: לאום שואף להגדרה עצמית ולמימוש היסודות שלו במדינה עצמאית. קבוצה אתנית לא שואפת להגדרה עצמית.","יסודות: לאום יכול להתבסס על יסודות אתניים (שלא בוחרים) או על יסודות אזרחיים (שבוחרים). קבוצה אתנית מבוססת רק על יסודות שלא בוחרים."],1],
["הבדלים בין לאומיות אתנית־תרבותית לאזרחית","שלושה הבדלים עיקריים:",["יסודות: באתנית־תרבותית – מוצא, תרבות, שפה ודת (נולדים לתוכם). באזרחית – רצון לחיות יחד לפי ערכים שבוחרים (חירות, שוויון).","זמן: אתנית־תרבותית קיימת לפני המדינה והלאום יוצר אותה (הלאום היהודי הקים את ישראל). אזרחית נוצרת אחרי שהמדינה קמה, והמדינה יוצרת אותה (ארה״ב).","קשר לאזרחות: באתנית־תרבותית לא חייב להיות קשר בין אזרחות ללאום (ערבי ישראלי). באזרחית כל האזרחים הם בני אותו לאום (אמריקאי)."],1]]},
{id:"dem",t:"🗳️ דמוקרטיה ובחירות",i:[
["חירות","כל אדם נולד חופשי ומנהל את חייו כרצונו, כל עוד אינו פוגע בזולתו."],
["שוויון","כל בני האדם שווים בערכם ובזכויותיהם. אין אפליה."],
["המתח בין חירות לשוויון","שוויון חברתי־כלכלי פוגע לעיתים בחירות. דוגמה: מיסים גבוהים."],
["שלטון העם","העם הוא הריבון ומקור הסמכות. הוא בוחר נציגים לזמן מוגבל.",["מאפשר השתתפות פוליטית והחלפת שלטון בבחירות."]],
["5 תנאי בחירות דמוקרטיות","כלליות · חשאיות · שוויוניות · מחזוריות · התמודדות חופשית.",["כלליות: כל אזרח מגיל מסוים בוחר ונבחר.","חשאיות: בוחרים אנונימית, מאחורי פרגוד.","שוויוניות: קול אחד לכל אחד, וכל קול שווה.","מחזוריות: חוזרות במועד שנקבע בחוק.","התמודדות חופשית: תחרות הוגנת, חופש ביטוי ועיתונות."]],
["שיטת הבחירות בישראל","ארצית־יחסית־רשימתית.",["ארצית: כל הארץ אזור בחירה אחד.","יחסית: מושבים לפי אחוז הקולות.","רשימתית: מצביעים לרשימת מועמדים של מפלגה.","120 חברי כנסת. אחוז חסימה 3.25%.","מנדט = סך המצביעים ÷ 120."]],
["יתרונות השיטה","מעודדת ריבוי מפלגות, משקפת את מגוון הדעות ומאפשרת ייצוג למיעוטים."],
["חסרונות השיטה","קשר חלש בין בוחר לנבחר, ויציבות שלטונית נמוכה: מפלגות קטנות סוחטות (לשון מאזניים)."],
["מטרת אחוז החסימה","למנוע ריבוי מפלגות קטנות ולשמור על יציבות הממשלה."]]},
{id:"pri",t:"🧭 עקרונות דמוקרטיים",i:[
["פלורליזם","הכרה בשונות בין קבוצות והזכות לבטא אותה. מבוסס על פתיחות רעיונית.",["פוליטי: ריבוי מפלגות.","חברתי־כלכלי: ארגוני עובדים וארגונים חברתיים.","חינוך: זרמים (ממלכתי, ממלכתי־דתי, חרדי)."]],
["חשיבות הפלורליזם","מאפשר רבגוניות, מעודד סובלנות, ומונע אמת מוחלטת אחת (ספקנות וביקורת)."],
["סובלנות","לשמוע ולסבול דעות שונות, גם בלי להסכים, ולנהוג בכבוד.",["מאפשרת ויכוח בדרכי שלום ומונעת אלימות."]],
["הסכמיות","בסיס משותף בין הקבוצות: צורת משטר, קבלת שלטון נבחר, ציות לחוק, שוויון בפניו.",["יותר הסכמה = יותר יציבות."]],
["תרבות פוליטית דמוקרטית","הפנמת הכרעת הרוב, שלטון החוק, פלורליזם, סובלנות והסכמיות."],
["הכרעת הרוב","החלטות לפי רצון הרוב. גם המיעוט מחויב, אבל אסור לפגוע בזכויותיו.",["חשיבות: מייצגת את רוב האזרחים, מחייבת את כולם ושומרת על יציבות."]],
["עריצות הרוב","הרוב משתמש בכוחו לפגוע בלי הצדקה בזכויות האדם והמיעוט."],
["הכרעת רוב לגיטימית / לא לגיטימית","לגיטימית: לפי כללי הדמוקרטיה ובלי לפגוע בזכויות. לא לגיטימית: פוגעת בזכויות האדם והמיעוט."],
["סוגי רוב","שלושה סוגי רוב לקבלת החלטה: רגיל, מוחלט ומיוחד (מיוחס). לכל סוג נדרש מספר קולות אחר.",["רוב רגיל: החלטה שמתקבלת לפי מספר הקולות הרב ביותר של המשתתפים בהצבעה. לדוגמה – בכנסת (120 חברי כנסת) ההחלטה מתקבלת לפי רוב המצביעים מתוך מי שהיו בהצבעה.","רוב מוחלט: החלטה שמתקבלת בעד יותר מ־50% מבעלי זכות ההצבעה. לדוגמה – בכנסת נדרשים לפחות 61 חברי כנסת בעד.","רוב מיוחד / מיוחס: החלטה שמתקבלת בעד לא פחות מ־80 מבעלי זכות ההצבעה. לדוגמה – בכנסת נדרשים לפחות 80 חברי כנסת בעד (שני שלישים)."]]]},
{id:"nr",t:"🛡️ זכויות טבעיות",i:[
["זכויות טבעיות (זכויות האדם)","זכויות שמגיעות לאדם מעצם היותו אדם, מרגע לידתו. השלטון לא רשאי להגבילן ועליו להגן עליהן.",["זכויות האזרח = הזכויות הטבעיות + זכויות פוליטיות."]],
["1. קניין","הזכות להיות בעל רכוש, לשמור עליו וליהנות ממנו בלי שייקחו אותו.",["חומרי: בית, כסף, רכב.","רוחני: יצירות, המצאות."]],

(()=>{

/* כניסת מנהל: האימות מול Firebase Authentication, הסיסמה לא נשמרת בקוד */
