<style>

a{color:var(--ac)}.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}

.cm{max-width:88%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;align-self:flex-start;word-break:break-word;white-space:pre-wrap;line-height:1.5}
.cm.me{align-self:flex-end;background:#4f46e51f;border-color:var(--ac)}
.cm small{display:block;color:var(--mu);font-size:.75em;margin-bottom:1px}

{id:"dem",t:"🗳️ דמוקרטיה ובחירות",i:[

["שלטון העם","העם הוא הריבון ומקור הסמכות. הוא בוחר נציגים לזמן מוגבל.",["מאפשר השתתפות פוליטית והחלפת שלטון בבחירות."]],
["5 תנאי בחירות דמוקרטיות","כלליות · חשאיות · שוויוניות · מחזוריות · התמודדות חופשית.",["כלליות: כל אזרח מגיל מסוים בוחר ונבחר.","חשאיות: בוחרים אנונימית, מאחורי פרגוד.","שוויוניות: קול אחד לכל אחד, וכל קול שווה.","מחזוריות: חוזרות במועד שנקבע בחוק.","התמודדות חופשית: תחרות הוגנת, חופש ביטוי ועיתונות."]],
["שיטת הבחירות בישראל","ארצית־יחסית־רשימתית.",["ארצית: כל הארץ אזור בחירה אחד.","יחסית: מושבים לפי אחוז הקולות.","רשימתית: מצביעים לרשימת מועמדים של מפלגה.","120 חברי כנסת. אחוז חסימה 3.25%.","מנדט = סך המצביעים ÷ 120."]],
["יתרונות השיטה","מעודדת ריבוי מפלגות, משקפת את מגוון הדעות ומאפשרת ייצוג למיעוטים."],
["חסרונות השיטה","קשר חלש בין בוחר לנבחר, ויציבות שלטונית נמוכה: מפלגות קטנות סוחטות (לשון מאזניים)."],
["מטרת אחוז החסימה","למנוע ריבוי מפלגות קטנות ולשמור על יציבות הממשלה."]]},
{id:"pri",t:"🧭 עקרונות דמוקרטיים",i:[
["פלורליזם","הכרה בשונות בין קבוצות והזכות לבטא אותה. מבוסס על פתיחות רעיונית.",["פוליטי: ריבוי מפלגות.","חברתי־כלכלי: ארגוני עובדים וארגונים חברתיים.","חינוך: זרמים (ממלכתי, ממלכתי־דתי, חרדי)."]],
["חשיבות הפלורליזם","מאפשר רבגוניות, מעודד סובלנות, ומונע אמת מוחלטת אחת (ספקנות וביקורת)."],

["הכרעת הרוב","החלטות לפי רצון הרוב. גם המיעוט מחויב, אבל אסור לפגוע בזכויותיו.",["חשיבות: מייצגת את רוב האזרחים, מחייבת את כולם ושומרת על יציבות."]],

{id:"nr",t:"🛡️ זכויות טבעיות",i:[

["1. קניין","הזכות להיות בעל רכוש, לשמור עליו וליהנות ממנו בלי שייקחו אותו.",["חומרי: בית, כסף, רכב.","רוחני: יצירות, המצאות."]],
["2. שוויון","כולם שווים בערכם ובזכויותיהם. יחס שווה בלי אפליה על רקע דת, מין, מוצא, לאום, מראה, מוגבלות או השקפה.",["אפליה פסולה: יחס שונה בלי סיבה מוצדקת.","הבחנה: יחס שונה בגלל צרכים מיוחדים או דרישות רלוונטיות (קשישים, נכים, כישורים).","העדפה מתקנת: יחס שונה כדי לתקן קיפוח מהעבר ולצמצם פערים.","הבחנה והעדפה מתקנת אינן אפליה, כי יש להן סיבה מוצדקת."]],
["3. הליך הוגן","מי שנמצא בהליך משפטי לא ייפגע מעבר לנדרש לחקירה ולמשפט.",["חיפוש בבית רק עם צו בית משפט.","מעצר עד 24 שעות לפני הבאה לשופט.","לדעת במה נאשמים.","ייצוג בידי עורך דין.","אין עונש בלי משפט.","משפט פומבי.","זכות ערעור."]],
["4. חירות","חופש לפעול ולבחור כרצונך, כל עוד לא פוגעים באחר, בחוק ובערכי המדינה.",["חופש המחשבה והמצפון: לגבש דעות וערכים.","חופש הביטוי: להביע דעות ורגשות (גם לבוש, הפגנה, שביתה).","חופש התנועה: לנוע בארץ, לצאת ולחזור.","חופש הדת: להאמין ולקיים פולחן.","חופש מדת: לא להאמין ולא להיכפות.","חופש ההתאגדות: להקים ארגון, עמותה או מפלגה.","חופש העיסוק: לבחור מקצוע ומקום עבודה."]],
["5. כבוד","הזכות לא להיות מושפל או מעליב, פיזית או מילולית.",["שם טוב: שלא יפרסמו עליך מידע שקרי ומכפיש.","פרטיות: בלי חשיפה, חדירה, איסוף או פרסום מידע בלי הסכמה.","בטקסט: להציג כל זכות בנפרד ולהסביר את הספציפית."]],
["6. חיים וביטחון","לחיות בלי חשש מפגיעה גופנית או נפשית. המדינה חייבת להגן."]]},
{id:"oth",t:"⚖️ זכויות נוספות וחובות",i:[
["זכויות פוליטיות","חלק מזכויות האזרח: לבחור ולהיבחר, להתאגד פוליטית ולמחות נגד השלטון."],
["זכויות קבוצה / מיעוט","המדינה מעניקה למיעוט זכויות לשמור על זהותו.",["חינוך משלו.","שפה רשמית.","חופש דת ופולחן."]],
